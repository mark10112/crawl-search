[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-research-stack"
version = "0.2.0"
description = "SearXNG research MCP with bounded browser/OCR fallback and reproducible benchmarks"
requires-python = ">=3.12,<3.14"
dependencies = ["httpx>=0.28,<1", "trafilatura>=2,<3", "pymupdf>=1.26,<2", "mcp>=1.20,<2", "starlette>=0.40,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
browser = ["crawl4ai>=0.7,<1"]
ocr = ["docling>=2.60,<3", "easyocr>=1.7,<2"]

[project.scripts]
local-research = "local_research.cli:main"
local-research-mcp = "local_research.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_research"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
